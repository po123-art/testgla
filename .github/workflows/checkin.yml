name: GLaDOS Checkin

on:
  schedule:
    - cron: "30 1 * * *"        # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run checkin
        env:
          PYTHONUNBUFFERED: "1"
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}
          SESSION_SIG: ${{ secrets.SESSION_SIG }}
        run: python -u checkin.py
